<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autism Run 2026 — Langkawi Route & Operations Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:#fff}
.top{position:absolute;z-index:1000;left:16px;top:16px;background:#fff;border-radius:14px;box-shadow:0 3px 16px #0002;padding:12px 15px;max-width:430px}.top b{display:block;color:#08284d;font-size:16px}.top span{font-size:11px;color:#667085;line-height:1.5}
.route-under{stroke:#fff;stroke-width:14;stroke-opacity:.95;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#146fe8;stroke-width:8;stroke-opacity:1;stroke-linecap:round;stroke-linejoin:round}
.connector{stroke:#7c8da6;stroke-width:2;stroke-dasharray:5 6;stroke-opacity:.75}
.op{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 10px #0005;display:flex;align-items:center;justify-content:center;position:relative;font-size:24px}.op b{position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font-size:11px;font-weight:900;border:2px solid #fff}.start{background:#168a52}.cp{background:#1677e8}.sensory{background:#7a3ff2}.support{background:#f79009}.control{background:#d92d20}.finish{background:#111}
.popup{min-width:235px}.popup h3{margin:0 0 7px;font-size:14px;color:#08284d}.popup .act{font-size:11px;line-height:1.55;margin-top:7px}.popup .tag{display:inline-block;background:#eef4fb;border-radius:999px;padding:4px 7px;margin:2px;font-size:9px;font-weight:800}.popup .place{font-size:10px;color:#667085;margin-top:6px}
.legend{position:absolute;z-index:1000;right:16px;bottom:20px;background:#fff;border-radius:12px;box-shadow:0 3px 16px #0002;padding:9px 12px;font-size:10px;line-height:1.8}.legend i{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;margin-right:4px}.lg1{background:#168a52}.lg2{background:#1677e8}.lg3{background:#7a3ff2}.lg4{background:#f79009}.lg5{background:#d92d20}.lg6{background:#111}
.status{position:absolute;z-index:1000;left:16px;bottom:18px;background:#fff;border-radius:10px;box-shadow:0 2px 12px #0002;padding:8px 11px;font-size:10px;color:#667085}.status.ok{color:#168a52;font-weight:700}.status.warn{color:#9a6700}
</style>
</head>
<body>
<div class="top"><b>AUTISM RUN 2026 — LANGKAWI</b><span>ACTUAL ROAD ROUTE · MAHA TOWER → DATARAN LANG · OPERATIONAL MARKERS OVERLAID</span></div>
<div id="map"></div>
<div class="legend"><i class="lg1">▶</i> Start &nbsp; <i class="lg2">●</i> Checkpoint &nbsp; <i class="lg3">🧩</i> Sensory &nbsp; <i class="lg4">+</i> Support &nbsp; <i class="lg5">!</i> Final Control &nbsp; <i class="lg6">🏁</i> Finish</div>
<div id="status" class="status">Loading actual road route…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const pts=[
{id:1,name:'MAHA TOWER — START',lat:6.32016,lon:99.84586,roadLat:6.32016,roadLon:99.84586,cls:'start',icon:'▶',tags:['START','ASSEMBLY','MEDICAL'],activity:'Participant assembly, registration / QR check-in, briefing, accessibility support, pre-start medical and marshal release.',place:'Persiaran Mahawangsa, MAHA Tower'},
{id:2,name:'RUNNER CHECKPOINT',lat:6.31740,lon:99.85180,roadLat:6.31740,roadLon:99.85180,cls:'cp',icon:'💧',tags:['CHECKPOINT','WATER','MARSHAL'],activity:'Route guidance, hydration, regrouping, participant observation and checkpoint confirmation.',place:'Persiaran Putra — Kuah town approach'},
{id:3,name:'KUAH WATERFRONT',lat:6.31357,lon:99.85162,roadLat:6.31380,roadLon:99.85350,cls:'cp',icon:'🛟',tags:['WATERFRONT','HYDRATION','SECURITY'],activity:'Hydration, route control, pedestrian / vehicle interface, security and marshal deployment.',place:'Kuah Waterfront / Lagenda Park Beach area'},
{id:4,name:'TAMAN LAGENDA — SENSORY SAFE ZONE',lat:6.30885,lon:99.85459,roadLat:6.30987,roadLon:99.85609,cls:'sensory',icon:'🧩',tags:['SENSORY','REST','NASOM'],activity:'Low-stimulation rest, shade, water, parent / caregiver support and autism-trained volunteers.',place:'Taman Lagenda — marker shown inside the park; route remains on the public road'},
{id:5,name:'SUPPORT ZONE',lat:6.30987,lon:99.85609,roadLat:6.30987,roadLon:99.85609,cls:'support',icon:'🏥',tags:['MEDICAL','WATER','SUPPORT'],activity:'Hydration, medical observation, recovery support and rear-sweeper coordination.',place:'Persiaran Putra / Langkawi Fair approach'},
{id:6,name:'FINAL CONTROL',lat:6.30870,lon:99.85300,roadLat:6.30870,roadLon:99.85300,cls:'control',icon:'🚧',tags:['TRAFFIC','BARRICADE','AMBULANCE'],activity:'High-priority traffic control, barricades, police / security coordination and protected emergency lane.',place:'Dataran Lang approach — Persiaran Putra'},
{id:7,name:'DATARAN LANG / EAGLE SQUARE — FINISH',lat:6.30830,lon:99.85192,roadLat:6.30830,roadLon:99.85192,cls:'finish',icon:'🏁',tags:['FINISH','RECOVERY','FAMILY'],activity:'Finish line, timing, medals, hydration, medical / recovery, family reunification, security and participant dispersal.',place:'Dataran Lang / Eagle Square'}
];

const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([6.313,99.852],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);

function addMarker(p){
 const icon=L.divIcon({className:'',html:`<div class="op ${p.cls}">${p.icon}<b>${p.id}</b></div>`,iconSize:[52,52],iconAnchor:[26,26],popupAnchor:[0,-30]});
 const html=`<div class="popup"><h3>${p.id}. ${p.name}</h3><div>${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="place">📍 ${p.place}</div><div class="act"><b>Personnel / activity:</b><br>${p.activity}</div></div>`;
 L.marker([p.lat,p.lon],{icon,zIndexOffset:1000}).addTo(map).bindPopup(html);
 if(Math.abs(p.lat-p.roadLat)>0.00005 || Math.abs(p.lon-p.roadLon)>0.00005){
   L.polyline([[p.lat,p.lon],[p.roadLat,p.roadLon]],{className:'connector',color:'#7c8da6',weight:2,dashArray:'5 6',opacity:.75}).addTo(map);
 }
}
pts.forEach(addMarker);

async function loadRoadRoute(){
 const status=document.getElementById('status');
 try{
   // IMPORTANT: operational pins are NOT routing waypoints. The blue route is calculated ONLY from START to FINISH.
   const start=pts[0], finish=pts[6];
   const coords=`${start.lon},${start.lat};${finish.lon},${finish.lat}`;
   const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false&alternatives=false`;
   const res=await fetch(url); if(!res.ok) throw new Error('Routing unavailable');
   const data=await res.json(); if(data.code!=='Ok'||!data.routes?.length) throw new Error('No road route');
   const geometry=data.routes[0].geometry.coordinates.map(([lon,lat])=>[lat,lon]);
   L.polyline(geometry,{className:'route-under',color:'#fff',weight:14,opacity:.95}).addTo(map);
   L.polyline(geometry,{className:'route',color:'#146fe8',weight:8,opacity:1}).addTo(map);
   map.fitBounds(L.latLngBounds(geometry),{padding:[65,65]});
   const km=(data.routes[0].distance/1000).toFixed(2);
   status.className='status ok'; status.textContent=`ACTUAL ROAD ROUTE · ${km} km · START → FINISH`;
 }catch(err){
   status.className='status warn'; status.textContent='Road routing unavailable — route line hidden rather than drawing a false straight line.';
   map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])),{padding:[65,65]});
 }
}
loadRoadRoute();
</script>
</body>
</html>
